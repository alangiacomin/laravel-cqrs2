name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: 🚨 Breaking changes
    labels:
      - major
  - title: ✨ Nuove funzionalità
    labels:
      - minor
  - title: 🐛 Correzioni
    labels:
      - patch

version-resolver:
  major:
    labels:
      - major
  minor:
    labels:
      - minor
  patch:
    labels:
      - patch
default: patch

template: |
  ## Modifiche

  $CHANGES

change-template: '- $TITLE by @$AUTHOR in #$NUMBER'

autolabeler:
  - label: "chore"
    files:
      - "*.md"
    branch:
      - '/docs{0,1}\/.+/'
  - label: "bug"
    branch:
      - '/fix\/.+/'
    title:
      - "/fix/i"
  - label: "enhancement"
    branch:
      - '/feature\/.+/'
      - '/feat\/.+/'
    body:
      - "/JIRA-[0-9]{1,4}/"
