name: Release Drafter

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  verifica-label:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica label versione
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request

            if (context.payload.action === 'closed' && !pr.merged) {
              core.info('PR chiusa senza merge: nessun rilascio da preparare')
              return
            }

            const labels = pr.labels.map(l => l.name)
            const valide = ['major', 'minor', 'patch']
            const trovate = labels.filter(l => valide.includes(l))

            if (trovate.length !== 1) {
              core.setFailed(
                'Prima del merge serve una sola label: major, minor o patch'
              )
            }

  aggiorna-draft:
    needs: verifica-label
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
