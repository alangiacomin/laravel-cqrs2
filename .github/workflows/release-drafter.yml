name: Release Drafter

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  verifica-label-versione:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Controlla presenza label valida
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name)

            const valide = ['major', 'minor', 'patch']

            const trovate = labels.filter(l => valide.includes(l))

            if (trovate.length !== 1) {
              core.setFailed(
                'La PR deve avere una e una sola label tra: major, minor, patch'
              )
            }

  aggiorna-release-draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    #needs: []

    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
