name: Release Drafter

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
      - unlabeled
      - closed

permissions:
  contents: write
  pull-requests: read

jobs:
  verifica-label-versione:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Controlla label
        uses: actions/github-script@v8
        with:
          script: |
            const labels = context.payload.pull_request.labels.map(l => l.name)
            const valide = ['major', 'minor', 'patch']
            const trovate = labels.filter(l => valide.includes(l))

            if (trovate.length !== 1) {
              core.setFailed(
                'Serve una sola label tra major, minor o patch'
              )
            }

  aggiorna-draft:
    if: github.event.pull_request.merged == true || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
