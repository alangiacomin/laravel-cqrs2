name: Release Drafter

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
      - closed
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: read

jobs:
  verifica-label:
    runs-on: ubuntu-latest

    steps:
      - name: Verifica label versione
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request

            const validaLabelVersione = () => {
              const labels = pr.labels.map(l => l.name)
              const valide = ['major', 'minor', 'patch']
              const trovate = labels.filter(l => valide.includes(l))

              if (trovate.length !== 1) {
                core.setFailed(
                  'Prima del merge serve una sola label: major, minor o patch'
                )
              }
            }

            if (context.payload.action === 'closed') {
              if (!pr.merged) {
                core.info('PR chiusa senza merge: nessun rilascio da preparare')
                return
              }

              validaLabelVersione()
              return
            }

            if (
              context.eventName === 'pull_request_review' &&
              context.payload.review.state === 'approved'
            ) {
              validaLabelVersione()
              return
            }

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                per_page: 100,
              }
            )

            const ultimiStatiPerReviewer = new Map()

            for (const review of reviews) {
              ultimiStatiPerReviewer.set(review.user.id, review.state)
            }

            const approvata = [...ultimiStatiPerReviewer.values()].includes(
              'APPROVED'
            )

            if (!approvata) {
              core.info(
                'Controllo label saltato: la PR non ha ancora una review approved'
              )
              return
            }

            validaLabelVersione()

  aggiorna-draft:
    needs: verifica-label
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
